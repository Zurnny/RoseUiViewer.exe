<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROSE UI Viewer</title>
<meta name="description" content="Preview and edit ROSE Online's interface files in your browser, without logging into the game.">
<style>
  :root { --bg: #1c1a18; --panel: #24201b; --text: #ece3d0; --dim: #a59a86; --brass: #d6a854; --err: #ff7a66; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(20, 18, 16, 0.86); z-index: 10; }
  #overlay[hidden] { display: none; }
  #box { max-width: 520px; padding: 28px 30px; background: var(--panel); border: 1px solid #5c4a30; border-radius: 8px; text-align: center; }
  #box h1 { margin: 0 0 8px; font-size: 20px; color: var(--brass); font-weight: 600; }
  #box p { margin: 6px 0; color: var(--dim); }
  #bar { height: 6px; margin: 16px 0 4px; background: #3a3027; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--brass); transition: width .15s; }
  #box.error h1 { color: var(--err); }
  #box button { margin-top: 14px; padding: 7px 16px; background: #3a3027; color: var(--text); border: 1px solid #6c5838;
    border-radius: 4px; font: inherit; cursor: pointer; }
  #box button:hover { background: #4d3f30; }
  #folderInput { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<input type="file" id="folderInput" webkitdirectory multiple>
<div id="overlay">
  <div id="box">
    <h1 id="title">Loading ROSE UI Viewer…</h1>
    <p id="detail">Getting the viewer ready.</p>
    <div id="bar"><div id="fill"></div></div>
    <button id="okButton" hidden>OK</button>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------------------------------
// The viewer runs on files in memory: the game folder the user opens is copied to /game (only what the UI
// needs: Data/ui and the fonts), and saved files are written back to it. Settings and sample data live in
// the browser's storage (/app). Nothing is uploaded anywhere.
// ---------------------------------------------------------------------------------------------------
const overlay = document.getElementById('overlay');
const ui = {
  show(title, detail, progress) {
    overlay.hidden = false;
    document.getElementById('box').classList.remove('error');
    document.getElementById('title').textContent = title;
    document.getElementById('detail').textContent = detail || '';
    document.getElementById('bar').style.display = progress === undefined ? 'none' : '';
    document.getElementById('fill').style.width = ((progress || 0) * 100).toFixed(1) + '%';
    document.getElementById('okButton').hidden = true;
  },
  error(title, detail) {
    this.show(title, detail);
    document.getElementById('box').classList.add('error');
    const ok = document.getElementById('okButton');
    ok.hidden = false;
    ok.onclick = () => this.hide();
  },
  hide() { overlay.hidden = true; document.getElementById('canvas').focus(); }
};

// A tiny key/value store in IndexedDB, for the folder handle (Chrome/Edge remember folder access).
const kv = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('rose-ui-viewer', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(key) {
    try {
      const db = await this.open();
      return await new Promise(res => { const r = db.transaction('kv').objectStore('kv').get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); });
    } catch { return undefined; }
  },
  async set(key, value) {
    try {
      const db = await this.open();
      await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(value, key); t.oncomplete = res; t.onerror = res; });
    } catch {}
  }
};

const lower = s => s.toLowerCase();
const isFont = n => /\.(ttf|otf)$/i.test(n);

var rose = {
  canSaveInPlace: 'showDirectoryPicker' in window,
  dir: null,              // FileSystemDirectoryHandle of the game folder (Chrome/Edge)
  savedHandle: null,      // from a previous visit
  savedName: '',
  tracked: new Map(),     // "Data/ui/..." -> { handle, lastModified, size }
  dataPrefix: '',         // path inside the opened folder that holds Data ('' or 'Data/' when the user picked Data itself)
  busy: false,
  appDirty: false,

  async init() {
    // Only the folder's name is read now; the folder itself is fetched from storage when Reopen is
    // clicked (some browser builds crash reading stored folder access back, so it never happens on load).
    if (this.canSaveInPlace) {
      try { this.savedName = localStorage.getItem('rose-folder-name') || ''; } catch {}
    }
    document.getElementById('folderInput').addEventListener('change', e => this.loadFromFileList(e.target.files));
    // Keep the browser's own shortcuts from taking over the viewer's (reload page, save page...).
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (e.key === 'F5' || e.key === 'F8' || e.key === 'F2' ||
          ((e.ctrlKey || e.metaKey) && ['s', 'z', 'y', '0', '=', '+', '-', 'a'].includes(k)))
        e.preventDefault();
    }, true);
    setInterval(() => this.syncApp(), 2000);
    setInterval(() => this.syncApp(true), 10000); // the panel layout is saved by the editor itself
    setInterval(() => this.watch(), 1500);
    window.addEventListener('beforeunload', () => this.syncApp(true));
  },

  viewerReady() { if (!this.busy) ui.hide(); },

  // ------------------------------------------------------------------ opening a folder
  async pickFolder() {
    if (this.canSaveInPlace) {
      let d;
      try { d = await window.showDirectoryPicker({ id: 'rose-game', mode: 'readwrite' }); }
      catch (e) { if (e.name !== 'AbortError') ui.error("Couldn't open that folder", e.message); return; }
      await this.useDirectory(d);
    } else {
      document.getElementById('folderInput').click();
    }
  },

  async reopen() {
    const h = this.savedHandle || await kv.get('gameFolder');
    if (!h) { this.forget(); return this.pickFolder(); }
    try {
      const p = await h.requestPermission({ mode: 'readwrite' });
      if (p !== 'granted') { ui.error('Permission needed', 'Allow access to ' + h.name + ' to use it again, or choose the folder.'); return; }
      await this.useDirectory(h);
    } catch (e) { ui.error("Couldn't reopen " + h.name, e.message + ' — choose the folder again.'); }
  },

  forget() {
    this.savedHandle = null; this.savedName = '';
    try { localStorage.removeItem('rose-folder-name'); } catch {}
  },

  async findChild(dirHandle, name, kind) {
    for await (const [n, h] of dirHandle.entries())
      if (lower(n) === lower(name) && h.kind === kind) return [n, h];
    return null;
  },

  async useDirectory(d) {
    // The folder should hold Data (or be Data itself, or Data/ui).
    let dataDir = null;
    const data = await this.findChild(d, 'Data', 'directory');
    if (data) { dataDir = data[1]; this.dataPrefix = data[0] + '/'; }
    else if (await this.findChild(d, 'ui', 'directory')) { dataDir = d; this.dataPrefix = ''; }
    if (!dataDir || !(await this.findChild(dataDir, 'ui', 'directory'))) {
      ui.error("That isn't a ROSE Online folder", 'Choose the folder that has Data in it (Data\\ui\\themes is inside it).');
      return;
    }
    this.busy = true;
    try {
      ui.show('Opening ' + d.name + '…', 'Finding the interface files and fonts.', 0);
      const found = [];
      await this.walk(dataDir, 'Data/', found, 0);
      // Copied into a holding folder and switched in at the end, so the viewer never sees half a folder.
      this.clearDir('/game-new');
      const tracked = new Map();
      let i = 0;
      for (const f of found) {
        const file = await f.handle.getFile();
        this.put(f.path, new Uint8Array(await file.arrayBuffer()), '/game-new/');
        tracked.set(f.path, { handle: f.handle, lastModified: file.lastModified, size: file.size });
        if (++i % 20 === 0) ui.show('Opening ' + d.name + '…', i + ' of ' + found.length + ' files', i / found.length);
      }
      this.swapIn();
      this.tracked = tracked;
      this.dir = d;
      this.dataDir = dataDir;
      this.savedHandle = d; this.savedName = d.name;
      await kv.set('gameFolder', d);
      try { localStorage.setItem('rose-folder-name', d.name); } catch {}
      Module.ccall('RoseWeb_FolderLoaded', null, [], []);
      ui.hide();
    } catch (e) { ui.error("Couldn't read the folder", e.message); }
    finally { this.busy = false; }
  },

  // Everything under Data/ui, plus fonts anywhere under Data (a few levels deep).
  async walk(dirHandle, path, out, depth) {
    const inUi = lower(path).startsWith('data/ui/');
    for await (const [name, h] of dirHandle.entries()) {
      const p = path + name;
      if (h.kind === 'directory') {
        if (depth < 6 && (inUi || lower(p) === 'data/ui' || depth < 4)) await this.walk(h, p + '/', out, depth + 1);
      } else if (inUi || isFont(name)) out.push({ path: p, handle: h });
    }
  },

  // Firefox/Safari: a folder chosen with the file input (read only; saves download).
  async loadFromFileList(list) {
    const files = Array.from(list);
    if (!files.length) return;
    // webkitRelativePath = "<picked folder>/Data/ui/..."; find where Data starts.
    const rel = f => f.webkitRelativePath.split('/').slice(1).join('/');
    let prefix = null;
    for (const f of files) {
      const r = lower(rel(f));
      if (r.startsWith('data/ui/')) { prefix = ''; break; }
      if (r.startsWith('ui/')) { prefix = 'Data/'; }
    }
    if (prefix === null) { ui.error("That isn't a ROSE Online folder", 'Choose the folder that has Data in it.'); return; }
    this.busy = true;
    try {
      const wanted = files.filter(f => { const r = lower(prefix + rel(f)); return r.startsWith('data/ui/') || (r.startsWith('data/') && isFont(r)); });
      this.clearDir('/game-new');
      let i = 0;
      for (const f of wanted) {
        this.put(prefix + rel(f), new Uint8Array(await f.arrayBuffer()), '/game-new/');
        if (++i % 20 === 0) ui.show('Opening ' + files[0].webkitRelativePath.split('/')[0] + '…', i + ' of ' + wanted.length + ' files', i / wanted.length);
      }
      this.swapIn();
      this.dir = null;
      Module.ccall('RoseWeb_FolderLoaded', null, [], []);
      ui.hide();
    } catch (e) { ui.error("Couldn't read the folder", e.message); }
    finally { this.busy = false; document.getElementById('folderInput').value = ''; }
  },

  clearDir(dir) {
    const rm = p => {
      for (const n of FS.readdir(p)) {
        if (n === '.' || n === '..') continue;
        const q = p + '/' + n;
        if (FS.isDir(FS.stat(q).mode)) { rm(q); FS.rmdir(q); } else FS.unlink(q);
      }
    };
    try { rm(dir); FS.rmdir(dir); } catch {}
    FS.mkdir(dir);
  },

  swapIn() {
    this.clearDir('/game');
    FS.rmdir('/game');
    FS.rename('/game-new', '/game');
  },

  put(path, bytes, root) {
    const full = (root || '/game/') + path;
    FS.mkdirTree(full.substring(0, full.lastIndexOf('/')));
    FS.writeFile(full, bytes);
  },

  // ------------------------------------------------------------------ saving
  fileWritten(path) {
    if (path.startsWith('/app/')) { this.appDirty = true; return; }
    if (!path.startsWith('/game/')) return;
    const rel = path.substring(6);
    const bytes = FS.readFile(path);
    if (this.dir) this.writeBack(rel, bytes).catch(e => ui.error("Couldn't save " + rel, e.message + ' — the change is still in the viewer.'));
    else this.saveAs(rel.substring(rel.lastIndexOf('/') + 1), bytes);
  },

  async writeBack(rel, bytes) {
    // rel = "Data/ui/..."; the real folder may name Data differently (data, DATA...).
    const parts = rel.split('/');
    let dir = this.dataDir;
    for (const part of parts.slice(1, -1)) {
      const found = await this.findChild(dir, part, 'directory');
      dir = found ? found[1] : await dir.getDirectoryHandle(part, { create: true });
    }
    const name = parts[parts.length - 1];
    const existing = await this.findChild(dir, name, 'file');
    const fh = existing ? existing[1] : await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(bytes);
    await w.close();
    const file = await fh.getFile();
    this.tracked.set(rel, { handle: fh, lastModified: file.lastModified, size: file.size });
  },

  download(path) {
    try { this.saveAs(path.substring(path.lastIndexOf('/') + 1), FS.readFile(path)); } catch {}
  },

  saveAs(name, bytes) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes]));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },

  // ------------------------------------------------------------------ picking up outside edits (Chrome/Edge)
  async watch() {
    if (!this.dir || this.busy || this.watching) return;
    this.watching = true;
    try {
      for (const [rel, t] of this.tracked) {
        if (!lower(rel).startsWith('data/ui/')) continue;
        let file;
        try { file = await t.handle.getFile(); } catch { continue; }
        if (file.lastModified !== t.lastModified || file.size !== t.size) {
          this.put(rel, new Uint8Array(await file.arrayBuffer()));
          t.lastModified = file.lastModified; t.size = file.size;
        }
      }
    } finally { this.watching = false; }
  },

  // ------------------------------------------------------------------ browser storage for /app
  syncApp(force) {
    if (!this.appDirty && !force) return;
    this.appDirty = false;
    try { FS.syncfs(false, () => {}); } catch {}
  }
};

var Module = {
  canvas: document.getElementById('canvas'),
  preRun: [() => {
    FS.mkdir('/app');
    FS.mount(IDBFS, {}, '/app');
    FS.mkdir('/game');
    addRunDependency('app-storage');
    FS.syncfs(true, () => removeRunDependency('app-storage'));
  }],
  print: t => console.log(t),
  printErr: t => console.warn(t),
  setStatus: t => { if (t) ui.show('Loading ROSE UI Viewer…', t.replace(/\(\d+\/\d+\)/, '').trim()); },
  onAbort: what => ui.error('The viewer stopped', String(what || '') + ' — reload the page to start again.')
};
if (!window.WebGL2RenderingContext)
  ui.error('This browser is too old', 'ROSE UI Viewer needs WebGL 2 (any current Chrome, Edge, Firefox or Safari).');
rose.init();
</script>
{{{ SCRIPT }}}
</body>
</html>
