name: Build

# Every push to main builds RoseUiViewer.exe and publishes it as release v1.<build number>.
# The viewer checks that release and updates itself.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Build this tag or commit instead (for crash lookups; nothing is published)"
        required: false
        default: ""
      version:
        description: "Version to stamp (e.g. 1.10) when rebuilding an old one"
        required: false
        default: ""
      lookup:
        description: "Crash offsets to name, e.g. 0x1F1FF0 0x12AB0 (RoseUiViewer.exe+offset from crash.txt)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version != '' && inputs.version || format('1.{0}', github.run_number) }}
      # A map file (function addresses) is made alongside the exe; it doesn't change the program.
      LDFLAGS: /MAP
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DROSEVIEW_VERSION="$env:VERSION" 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Shows the important lines of a failed configure/build as annotations on the run summary.
      - name: Report errors
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in @("configure.log", "build.log")) {
            if (Test-Path $f) {
              Get-Content $f | Select-String -Pattern "error|CMake Error|fatal" -CaseSensitive:$false |
                Select-Object -First 25 | ForEach-Object { Write-Output "::error title=$f::$($_.Line.Trim())" }
              Get-Content $f -Tail 8 | ForEach-Object { Write-Output "::warning title=$f (end)::$($_.Trim())" }
            }
          }

      - name: Package
        shell: pwsh
        run: |
          $out = "RoseUiViewer"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/Release/RoseUiViewer.exe $out/
          Copy-Item README.md $out/README.md
          Copy-Item THIRD_PARTY_LICENSES.txt $out/
          Compress-Archive -Path "$out/*" -DestinationPath RoseUiViewer-windows.zip -Force
          Copy-Item build/Release/RoseUiViewer.exe RoseUiViewer.exe
          $map = Get-ChildItem build -Recurse -Filter RoseUiViewer.map | Select-Object -First 1
          if ($map) { Copy-Item $map.FullName RoseUiViewer.map }
          $hash = (Get-FileHash RoseUiViewer.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path RoseUiViewer.exe.sha256 -Value "$hash  RoseUiViewer.exe" -NoNewline -Encoding ascii

      # Names the functions at the given crash offsets, using the map file.
      - name: Crash lookup
        if: inputs.lookup != ''
        shell: pwsh
        run: |
          $lines = Get-Content RoseUiViewer.map
          $syms = foreach ($l in $lines) {
            if ($l -match '^\s*[0-9a-fA-F]{4}:[0-9a-fA-F]{8}\s+(\S+)\s+([0-9a-fA-F]{16})\s+(.*)$') {
              [pscustomobject]@{ Name = $matches[1]; Va = [Convert]::ToUInt64($matches[2], 16); Obj = $matches[3].Trim() }
            }
          }
          $syms = $syms | Sort-Object Va
          $base = [Convert]::ToUInt64("140000000", 16)
          foreach ($off in "${{ inputs.lookup }}".Split(" ", [StringSplitOptions]::RemoveEmptyEntries)) {
            $va = $base + [Convert]::ToUInt64($off.Replace("0x",""), 16)
            $hit = $syms | Where-Object { $_.Va -le $va } | Select-Object -Last 1
            $undec = $hit.Name
            try { $undec = (& undname $hit.Name 2>$null | Select-String 'is :- "(.*)"').Matches[0].Groups[1].Value } catch {}
            $msg = "$off = $undec +0x{0:X}  ({1})" -f ($va - $hit.Va), $hit.Obj
            Write-Output "::warning title=crash lookup::$msg"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RoseUiViewer-windows
          path: |
            RoseUiViewer-windows.zip
            RoseUiViewer.exe
            RoseUiViewer.map

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ROSE UI Viewer ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            **New install:** download RoseUiViewer-windows.zip, unzip it somewhere you can write to (Desktop or Documents), and run RoseUiViewer.exe.
            Installed copies update themselves.
          files: |
            RoseUiViewer-windows.zip
            RoseUiViewer.exe
            RoseUiViewer.exe.sha256
            RoseUiViewer.map
