name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $out = "RoseUiViewer"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/Release/RoseUiViewer.exe $out/
          Copy-Item README.md $out/README.md
          Copy-Item THIRD_PARTY_LICENSES.txt $out/
          Compress-Archive -Path "$out/*" -DestinationPath RoseUiViewer-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RoseUiViewer-windows
          path: RoseUiViewer-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RoseUiViewer-windows.zip
